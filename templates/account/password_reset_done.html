{% extends "base.html" %}

{% block title %}
Password Reset Sent | World Cup Hub 2026
{% endblock %}

{% block content %}

<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-6">

            <div class="auth-panel text-center">

                <i class="fa-solid fa-envelope-circle-check auth-icon"></i>

                <h1 class="mb-3">Check Your Email</h1>

                <p class="mb-4">
                    We have sent you an email with instructions to reset your password.
                    If it does not arrive shortly, please check your spam folder.
                </p>

                <a href="{% url 'account_login' %}" class="wc-btn-primary">
                    Back to Login
                </a>

            </div>

        </div>
    </div>
</section>

{% endblock %}
