{% extends "base.html" %}

{% block title %}
Password Reset | World Cup Hub 2026
{% endblock %}

{% block content %}

<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-6">

            <div class="auth-panel text-center">

                <i class="fa-solid fa-key auth-icon"></i>

                <h1 class="mb-3">Password Reset</h1>

                <p class="mb-4">
                    Forgotten your password? Enter your email address below and
                    we will send you instructions to reset it.
                </p>

                <form method="post" action="{% url 'account_reset_password' %}">
                    {% csrf_token %}

                    <div class="mb-4 text-start">
                        <label for="id_email" class="form-label">
                            Email address
                        </label>

                        <input type="email"
                               name="email"
                               placeholder="Email address"
                               autocomplete="email"
                               required
                               id="id_email"
                               class="form-control">
                    </div>

                    <div class="mobile-button-stack">
                        <button type="submit" class="wc-btn-primary">
                            Reset My Password
                        </button>

                        <a href="{% url 'account_login' %}" class="wc-btn-outline">
                            Back to Login
                        </a>
                    </div>

                </form>

            </div>

        </div>
    </div>
</section>

{% endblock %}
