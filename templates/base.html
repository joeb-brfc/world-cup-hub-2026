{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}World Cup Hub 2026{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">World Cup Hub 2026</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="#">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="{% url 'fixtures' %}">Fixtures</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="{% url 'my_predictions' %}"> My Predictions </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">Pontoon</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="{% url 'leaderboard' %}"> Leaderboard </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">Login</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main>
      {% if messages %}
      <div class="container mt-3">
        {% for message in messages %}

        <!-- https://getbootstrap.com/docs/4.0/components/alerts/ -->
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}

          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        {% endfor %}
      </div>
      {% endif %} {% block content %} {% endblock %}
    </main>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="{% static 'js/script.js' %}"></script>
  </body>
</html>
